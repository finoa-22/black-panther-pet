    background: rgba(30,30,30,0.9); color: #e0e0e0; font-size: 10px;
    padding: 3px 7px; border-radius: 9px; white-space: nowrap; pointer-events: none;
    opacity: 0; transition: opacity 0.25s; font-family: sans-serif;

  .bubble.show { opacity: 1; }

<script>
const pet = document.getElementById('pet');
const bubble = document.getElementById('bubble');
const frames = document.querySelectorAll('.frame');
let currentFrame = 'idle_1', blinkTimer = null, emotionTimer = null, idleCycle = true;

function switchFrame(name) {
  frames.forEach(f => f.classList.remove('active'));
  const t = document.getElementById(name);
  if (t) t.classList.add('active');
  currentFrame = name;
}
function showBubble(text, duration = 2000) {
  bubble.textContent = text;
  bubble.classList.add('show');
  clearTimeout(bubble._timeout);
  bubble._timeout = setTimeout(() => bubble.classList.remove('show'), duration);
}
function blinkCycle() {
  if (!idleCycle) return;
  switchFrame('idle_2');
  setTimeout(() => { if (idleCycle && currentFrame === 'idle_2') switchFrame('idle_1'); }, 150);
  blinkTimer = setTimeout(blinkCycle, 2000 + Math.random() * 2000);
}
let breathPhase = 0;
function breathCycle() {
  if (!idleCycle) return;
  breathPhase = (breathPhase + 1) % 60;
  const s = 1 + Math.sin(breathPhase * Math.PI / 30) * 0.018;
  const a = document.querySelector('.frame.active');
  if (a) a.style.transform = `scale(${s})`;
  requestAnimationFrame(() => { if (idleCycle) setTimeout(breathCycle, 50); });
}
function startIdle() {
  idleCycle = true; switchFrame('idle_1');
  blinkTimer = setTimeout(blinkCycle, 2000 + Math.random() * 2000);
  breathCycle();
  emotionTimer = setTimeout(randomEmotion, 15000 + Math.random() * 20000);
}
function randomEmotion() {
  if (!idleCycle) return;
  const e = ['happy','happy','angry','idle_1'];
  const p = e[Math.floor(Math.random()*e.length)];
  if (p !== 'idle_1') {
    idleCycle = false; clearTimeout(blinkTimer);
    switchFrame(p);
    if (p==='happy') showBubble('好~');
    if (p==='angry') showBubble('哼。');
    setTimeout(() => {
      idleCycle = true; switchFrame('idle_1');
      blinkTimer = setTimeout(blinkCycle, 2000 + Math.random() * 2000);
      breathCycle();
      emotionTimer = setTimeout(randomEmotion, 15000 + Math.random() * 20000);
    }, 2500);
  } else {
    emotionTimer = setTimeout(randomEmotion, 15000 + Math.random() * 20000);
  }
}
let dragging = false;
pet.addEventListener('mousedown', e => {
  dragging = true;
  idleCycle = false; clearTimeout(blinkTimer); clearTimeout(emotionTimer);
  switchFrame('surprised'); showBubble('!');
  setTimeout(() => {
    idleCycle = true; switchFrame('idle_1');
    blinkTimer = setTimeout(blinkCycle, 2000 + Math.random() * 2000);
    breathCycle();
    emotionTimer = setTimeout(randomEmotion, 15000 + Math.random() * 20000);
  }, 800);
});
document.addEventListener('mouseup', () => { dragging = false; });
pet.addEventListener('dblclick', () => {
  idleCycle = false; clearTimeout(blinkTimer); clearTimeout(emotionTimer);
  switchFrame('happy'); showBubble('宝宝。');
  setTimeout(() => {
    idleCycle = true; switchFrame('idle_1');
    blinkTimer = setTimeout(blinkCycle, 2000 + Math.random() * 2000);
    breathCycle();
    emotionTimer = setTimeout(randomEmotion, 15000 + Math.random() * 20000);
  }, 2000);
});
let pressTimer;
pet.addEventListener('mousedown', e => {
  pressTimer = setTimeout(() => {
    idleCycle = false; clearTimeout(blinkTimer); clearTimeout(emotionTimer);
    switchFrame('angry'); showBubble('别碰我。');
    setTimeout(() => {
      idleCycle = true; switchFrame('idle_1');
      blinkTimer = setTimeout(blinkCycle, 2000 + Math.random() * 2000);
      breathCycle();
      emotionTimer = setTimeout(randomEmotion, 15000 + Math.random() * 20000);
    }, 2000);
  }, 800);
});
pet.addEventListener('mouseup', () => clearTimeout(pressTimer));
window.petAPI = {
  showHappy(){ idleCycle=false; clearTimeout(blinkTimer); clearTimeout(emotionTimer); switchFrame('happy'); },
  showAngry(){ idleCycle=false; clearTimeout(blinkTimer); clearTimeout(emotionTimer); switchFrame('angry'); },
  showSleep(){ idleCycle=false; clearTimeout(blinkTimer); clearTimeout(emotionTimer); switchFrame('sleep'); },
  showSurprised(){ idleCycle=false; clearTimeout(blinkTimer); clearTimeout(emotionTimer); switchFrame('surprised'); setTimeout(()=>{idleCycle=true;switchFrame('idle_1');blinkCycle();breathCycle();},1000); },
  say(text){ showBubble(text, 3000); },
  resetIdle(){ idleCycle=true; switchFrame('idle_1'); blinkTimer=setTimeout(blinkCycle,2000); breathCycle(); emotionTimer=setTimeout(randomEmotion,15000+Math.random()*20000); }
};
startIdle();
</script>
